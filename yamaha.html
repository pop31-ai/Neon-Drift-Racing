<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yamaha Racing 3D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
        canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
    </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx;

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    cx = W / 2;
}
resize();
window.addEventListener('resize', resize);

const keys = {};
window.addEventListener('keydown', e => { keys[e.code] = true; e.preventDefault(); });
window.addEventListener('keyup', e => { keys[e.code] = false; });

let state = 'menu';
let score = 0, best = 0, lives = 3, dist = 0;
let speed = 0, maxSpeed = 18, accel = 0.12;
let playerX = 0, targetX = 0;
let boost = 100, boosting = false;
let roadOffset = 0, invTimer = 0;
let obstacles = [], coins = [], sparks = [];

const roadW = 220;
const laneCount = 3;
const laneW = roadW / laneCount;
const vanishY = H * 0.32;
const groundY = H;

function resetGame() {
    score = 0; lives = 3; dist = 0;
    speed = 0; playerX = 0; targetX = 0;
    boost = 100; boosting = false; invTimer = 0;
    obstacles = []; coins = []; sparks = [];
}

function toScreen(objZ, objX, objY) {
    const t = 1 - (objZ / 600);
    if (t <= 0) return null;
    const sx = cx + objX * t * 2.2;
    const sy = vanishY + (groundY - vanishY) * t;
    const scale = t * 2;
    return { x: sx, y: sy, s: scale, t: t };
}

function spawnObstacle() {
    const lane = Math.floor(Math.random() * laneCount) - 1;
    const type = Math.random() < 0.3 ? 'cone' : (Math.random() < 0.5 ? 'barrier' : 'oil');
    obstacles.push({ z: 600, lane: lane, type: type, w: type === 'barrier' ? 40 : 20 });
}

function spawnCoin() {
    const lane = Math.floor(Math.random() * laneCount) - 1;
    coins.push({ z: 600, lane: lane, collected: false });
}

function addSpark(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        sparks.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8 - 2,
            life: 1,
            color: color,
            size: 2 + Math.random() * 4
        });
    }
}

function update() {
    if (state !== 'play') return;

    if (keys['ArrowUp'] || keys['KeyW']) speed = Math.min(speed + accel, maxSpeed);
    else if (keys['ArrowDown'] || keys['KeyS']) speed = Math.max(speed - accel * 2, 0);
    else speed = Math.max(speed - 0.02, 0.5);

    if ((keys['Space'] || keys['ShiftLeft']) && boost > 0) {
        boosting = true;
        speed = Math.min(speed + 0.3, maxSpeed * 1.6);
        boost -= 0.8;
        if (Math.random() > 0.5) {
            const p = toScreen(0, playerX, 0);
            if (p) addSpark(p.x - 30 * p.s, p.y - 10 * p.s, '#ff6600', 1);
        }
    } else {
        boosting = false;
        boost = Math.min(boost + 0.15, 100);
    }

    if (keys['ArrowLeft'] || keys['KeyA']) targetX = Math.max(targetX - 3, -laneW);
    if (keys['ArrowRight'] || keys['KeyD']) targetX = Math.min(targetX + 3, laneW);
    playerX += (targetX - playerX) * 0.15;

    roadOffset += speed * 4;
    dist += speed * 0.5;
    score += Math.floor(speed * 0.5);
    if (invTimer > 0) invTimer--;

    if (Math.random() < 0.015 + speed * 0.001) spawnObstacle();
    if (Math.random() < 0.025) spawnCoin();

    const playerSX = cx + playerX * 2.2;
    const playerSY = groundY - 70;
    const playerR = 28;

    obstacles = obstacles.filter(o => {
        o.z -= speed * 5;
        if (o.z < 0) return false;
        if (o.z < 40) {
            const p = toScreen(o.z, o.lane * laneW, 0);
            if (p) {
                const dx = playerSX - p.x;
                const dy = playerSY - p.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < playerR + o.w * p.s * 0.4) {
                    if (invTimer <= 0) {
                        lives--;
                        invTimer = 60;
                        addSpark(playerSX, playerSY, '#ff4444', 15);
                        if (lives <= 0) { state = 'over'; best = Math.max(best, score); }
                    }
                    return false;
                }
            }
        }
        return true;
    });

    coins = coins.filter(c => {
        c.z -= speed * 5;
        if (c.z < 0) return false;
        if (c.z < 40) {
            const p = toScreen(c.z, c.lane * laneW, 0);
            if (p) {
                const dx = playerSX - p.x;
                const dy = (playerSY - 20) - p.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < playerR + 18 * p.s) {
                    score += 100;
                    addSpark(p.x, p.y, '#ffaa00', 10);
                    return false;
                }
            }
        }
        return true;
    });

    sparks = sparks.filter(s => {
        s.x += s.vx;
        s.y += s.vy;
        s.vy += 0.2;
        s.life -= 0.03;
        return s.life > 0;
    });
}

function drawRoad() {
    const g = ctx.createLinearGradient(0, vanishY, 0, H);
    g.addColorStop(0, '#0a0a1a');
    g.addColorStop(1, '#111122');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    for (let i = 0; i < 60; i++) {
        const starX = ((i * 173.7 + 50) % W);
        const starY = ((i * 91.3 + 20) % (vanishY - 10));
        ctx.fillStyle = `rgba(255,255,255,${0.3 + Math.sin(Date.now() * 0.001 + i) * 0.3})`;
        ctx.fillRect(starX, starY, 1.5, 1.5);
    }

    ctx.fillStyle = '#060612';
    ctx.beginPath();
    ctx.moveTo(0, vanishY + 20);
    for (let x = 0; x <= W; x += 40) {
        ctx.lineTo(x, vanishY + 10 + Math.sin(x * 0.02) * 15);
    }
    ctx.lineTo(W, vanishY + 60);
    ctx.lineTo(0, vanishY + 60);
    ctx.fill();

    for (let side = -1; side <= 1; side += 2) {
        for (let i = 0; i < 25; i++) {
            const bz = (i * 80 + roadOffset * 0.3) % 2000;
            const p = toScreen(bz, side * (roadW / 2 + 60 + Math.sin(i) * 30), 0);
            if (!p || p.t < 0.05) continue;
            const bw = 35 * p.s;
            const bh = (80 + (i % 3) * 40) * p.s;
            ctx.fillStyle = `hsl(220, 20%, ${8 + (i % 4) * 3}%)`;
            ctx.fillRect(p.x - bw / 2, p.y - bh, bw, bh);
            ctx.fillStyle = `rgba(255,255,150,${0.2 + Math.sin(Date.now() * 0.002 + i) * 0.15})`;
            for (let wy = 0; wy < 4; wy++) {
                for (let wx = 0; wx < 2; wx++) {
                    ctx.fillRect(p.x - bw / 2 + 4 + wx * bw * 0.45, p.y - bh + 6 + wy * bh * 0.22, bw * 0.3, bh * 0.15);
                }
            }
        }
    }

    const roadGrad = ctx.createLinearGradient(0, vanishY, 0, H);
    roadGrad.addColorStop(0, '#1a1a2a');
    roadGrad.addColorStop(1, '#222233');
    ctx.fillStyle = roadGrad;
    ctx.beginPath();
    ctx.moveTo(cx - 8, vanishY);
    ctx.lineTo(cx - roadW / 2 - 8, H);
    ctx.lineTo(cx + roadW / 2 + 8, H);
    ctx.lineTo(cx + 8, vanishY);
    ctx.fill();

    ctx.strokeStyle = '#00ff88';
    ctx.lineWidth = 3;
    ctx.shadowColor = '#00ff88';
    ctx.shadowBlur = 15;
    ctx.beginPath();
    ctx.moveTo(cx - 10, vanishY);
    ctx.lineTo(cx - roadW / 2 - 12, H);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx + 10, vanishY);
    ctx.lineTo(cx + roadW / 2 + 12, H);
    ctx.stroke();
    ctx.shadowBlur = 0;

    for (let i = 0; i < 30; i++) {
        const lz = (i * 60 + roadOffset) % 1800;
        const p = toScreen(lz, 0, 0);
        if (!p || p.t < 0.05) continue;
        const lw = 2 * p.s;
        const lh = 15 * p.s;
        ctx.fillStyle = `rgba(255,255,255,${p.t * 0.6})`;
        ctx.fillRect(p.x - lw / 2, p.y, lw, lh);
    }
}

function drawMotorcycle() {
    const sx = cx + playerX * 2.2;
    const sy = groundY - 55;
    const tilt = (targetX - playerX) * 0.012;

    if (invTimer > 0 && Math.floor(invTimer / 3) % 2 === 0) return;

    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(tilt);

    ctx.fillStyle = 'rgba(0,255,136,0.12)';
    ctx.beginPath();
    ctx.ellipse(0, 42, 35, 7, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.ellipse(0, 32, 18, 22, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#00ff88'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, 32, 12, 16, 0, 0, Math.PI * 2); ctx.stroke();

    ctx.fillStyle = '#222';
    ctx.fillRect(-3, 15, 6, 34);

    ctx.fillStyle = '#002288';
    ctx.beginPath();
    ctx.moveTo(-22, 20); ctx.lineTo(-18, -10); ctx.lineTo(-8, -28);
    ctx.lineTo(8, -28); ctx.lineTo(18, -10); ctx.lineTo(22, 20);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = '#00ff88';
    ctx.fillRect(-16, -2, 32, 3);

    ctx.fillStyle = '#0033aa';
    ctx.beginPath();
    ctx.ellipse(0, -8, 14, 10, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#00ff88';
    ctx.font = 'bold 10px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('Y', 0, -8);

    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.moveTo(-10, -28); ctx.quadraticCurveTo(0, -42, 10, -28);
    ctx.lineTo(8, -28); ctx.quadraticCurveTo(0, -36, -8, -28);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.ellipse(0, -36, 7, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#00ff88';
    ctx.beginPath();
    ctx.ellipse(0, -35, 4, 4, 0, Math.PI, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.moveTo(-6, -18); ctx.lineTo(-8, -6);
    ctx.lineTo(-4, 0); ctx.lineTo(4, 0);
    ctx.lineTo(8, -6); ctx.lineTo(6, -18);
    ctx.closePath(); ctx.fill();

    const brakeBright = speed < 2 ? 1 : 0.4;
    ctx.fillStyle = `rgba(255,20,20,${brakeBright})`;
    ctx.shadowColor = '#ff0000';
    ctx.shadowBlur = 12 * brakeBright;
    ctx.beginPath();
    ctx.ellipse(-14, 18, 4, 3, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(14, 18, 4, 3, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(-10, 16, 20, 3);
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#0044cc';
    ctx.beginPath();
    ctx.moveTo(-20, 20); ctx.lineTo(-16, 24); ctx.lineTo(-12, 22);
    ctx.lineTo(-8, 20); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(20, 20); ctx.lineTo(16, 24); ctx.lineTo(12, 22);
    ctx.lineTo(8, 20); ctx.closePath(); ctx.fill();

    ctx.fillStyle = '#ffffaa';
    ctx.shadowColor = '#ffffaa';
    ctx.shadowBlur = 15;
    ctx.beginPath(); ctx.ellipse(0, -44, 3, 2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;

    if (boosting && boost > 0) {
        for (let i = 0; i < 2; i++) {
            const ox = (i === 0) ? -12 : 12;
            const fl = 20 + Math.random() * 25;
            const fg = ctx.createLinearGradient(ox, 44, ox, 44 + fl);
            fg.addColorStop(0, 'rgba(255,200,0,0.9)');
            fg.addColorStop(0.4, 'rgba(255,100,0,0.6)');
            fg.addColorStop(1, 'rgba(255,50,0,0)');
            ctx.fillStyle = fg;
            ctx.beginPath();
            ctx.moveTo(ox - 4, 44);
            ctx.lineTo(ox, 44 + fl);
            ctx.lineTo(ox + 4, 44);
            ctx.closePath();
            ctx.fill();
        }
    }

    ctx.restore();
}

function drawObstacle(o) {
    const p = toScreen(o.z, o.lane * laneW, 0);
    if (!p || p.t < 0.05) return;
    const s = p.s;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.scale(s, s);

    if (o.type === 'barrier') {
        ctx.fillStyle = '#cc2222';
        ctx.fillRect(-20, -25, 40, 25);
        ctx.fillStyle = '#fff';
        for (let i = 0; i < 4; i++) ctx.fillRect(-18 + i * 10, -24, 5, 23);
        ctx.strokeStyle = '#ff4444';
        ctx.lineWidth = 1;
        ctx.strokeRect(-20, -25, 40, 25);
    } else if (o.type === 'cone') {
        ctx.fillStyle = '#ff8800';
        ctx.beginPath();
        ctx.moveTo(0, -35);
        ctx.lineTo(-10, 0);
        ctx.lineTo(10, 0);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.fillRect(-7, -18, 14, 4);
        ctx.fillRect(-5, -8, 10, 4);
    } else {
        ctx.fillStyle = 'rgba(20,20,20,0.8)';
        ctx.beginPath();
        ctx.ellipse(0, 0, 18, 6, 0, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.restore();
}

function drawCoin(c) {
    const p = toScreen(c.z, c.lane * laneW, 15);
    if (!p || p.t < 0.05) return;
    const s = p.s;
    const pulse = 1 + Math.sin(Date.now() * 0.005) * 0.15;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.scale(s * pulse, s * pulse);

    ctx.shadowColor = '#ffaa00';
    ctx.shadowBlur = 15;
    ctx.fillStyle = '#ffaa00';
    ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffcc44';
    ctx.beginPath(); ctx.arc(-1, -1, 6, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#0033aa';
    ctx.font = 'bold 9px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('Y', 0, 1);
    ctx.restore();
}

function drawSparks() {
    sparks.forEach(s => {
        ctx.globalAlpha = s.life;
        ctx.fillStyle = s.color;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size * s.life, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;
}

function drawHUD() {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.beginPath();
    ctx.roundRect(W - 170, H - 170, 140, 140, 70);
    ctx.fill();
    ctx.strokeStyle = '#00ff88';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(W - 100, H - 100, 65, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = '#00ff88';
    ctx.font = 'bold 38px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(Math.floor(speed * 10), W - 100, H - 108);
    ctx.fillStyle = '#00aa55';
    ctx.font = '12px Arial';
    ctx.fillText('KM/H', W - 100, H - 78);

    ctx.textAlign = 'right';
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 22px Arial';
    ctx.fillText('ОЧКИ: ' + score, W - 25, 40);
    ctx.fillStyle = '#aaa';
    ctx.font = '16px Arial';
    ctx.fillText(dist.toFixed(0) + 'm', W - 25, 65);

    for (let i = 0; i < lives; i++) {
        ctx.font = '24px Arial';
        ctx.fillText('❤', 30 + i * 30, 35);
    }

    ctx.fillStyle = 'rgba(255,100,0,0.2)';
    ctx.fillRect(25, H - 55, 150, 14);
    ctx.strokeStyle = '#ff6600';
    ctx.lineWidth = 2;
    ctx.strokeRect(25, H - 55, 150, 14);
    const bg = ctx.createLinearGradient(25, 0, 175, 0);
    bg.addColorStop(0, '#ff3300');
    bg.addColorStop(1, '#ffaa00');
    ctx.fillStyle = bg;
    ctx.fillRect(25, H - 55, boost * 1.5, 14);
    ctx.fillStyle = '#ff6600';
    ctx.font = '11px Arial';
    ctx.textAlign = 'left';
    ctx.fillText('TURBO [SPACE]', 30, H - 62);

    if (boosting) {
        ctx.fillStyle = `rgba(255,100,0,${0.05 + Math.random() * 0.05})`;
        ctx.fillRect(0, 0, W, H);
    }
}

function drawMenu() {
    ctx.fillStyle = 'rgba(0,0,0,0.85)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#00ff88';
    ctx.shadowColor = '#00ff88';
    ctx.shadowBlur = 40;
    ctx.font = 'bold 80px Arial';
    ctx.fillText('YAMAHA', cx, H * 0.28);
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#00aa55';
    ctx.font = '26px Arial';
    ctx.fillText('SPEED RACING 3D', cx, H * 0.36);

    ctx.fillStyle = '#888';
    ctx.font = '16px Arial';
    const controls = [
        '[← →] или [A D] — управление',
        '[↑] или [W] — газ    [↓] или [S] — тормоз',
        '[SPACE] — турбо буст',
        '',
        'Уклоняйся от препятствий, собирай монеты Y!'
    ];
    controls.forEach((line, i) => {
        ctx.fillText(line, cx, H * 0.46 + i * 28);
    });

    if (best > 0) {
        ctx.fillStyle = '#ffaa00';
        ctx.font = 'bold 18px Arial';
        ctx.fillText('РЕКОРД: ' + best, cx, H * 0.72);
    }

    ctx.fillStyle = '#00ff88';
    ctx.font = 'bold 22px Arial';
    const btnPulse = 1 + Math.sin(Date.now() * 0.004) * 0.05;
    ctx.save();
    ctx.translate(cx, H * 0.82);
    ctx.scale(btnPulse, btnPulse);
    ctx.fillStyle = 'rgba(0,255,136,0.15)';
    ctx.beginPath();
    ctx.roundRect(-120, -25, 240, 50, 25);
    ctx.fill();
    ctx.strokeStyle = '#00ff88';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#00ff88';
    ctx.fillText('СТАРТ', 0, 7);
    ctx.restore();
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.9)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff4444';
    ctx.shadowColor = '#ff4444';
    ctx.shadowBlur = 30;
    ctx.font = 'bold 64px Arial';
    ctx.fillText('АВАРИЯ!', cx, H * 0.3);
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#00ff88';
    ctx.font = 'bold 40px Arial';
    ctx.fillText('ОЧКИ: ' + score, cx, H * 0.45);

    if (score >= best && score > 0) {
        ctx.fillStyle = '#ffaa00';
        ctx.font = 'bold 22px Arial';
        ctx.fillText('🏆 НОВЫЙ РЕКОРД!', cx, H * 0.54);
    }

    ctx.fillStyle = '#00ff88';
    ctx.font = 'bold 22px Arial';
    ctx.fillStyle = 'rgba(0,255,136,0.15)';
    ctx.beginPath();
    ctx.roundRect(cx - 100, H * 0.65 - 25, 200, 50, 25);
    ctx.fill();
    ctx.strokeStyle = '#00ff88';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#00ff88';
    ctx.fillText('ЗАНОВО', cx, H * 0.65 + 7);
}

function draw() {
    ctx.clearRect(0, 0, W, H);
    drawRoad();

    const allItems = [
        ...obstacles.map(o => ({ type: 'obs', data: o, z: o.z })),
        ...coins.filter(c => !c.collected).map(c => ({ type: 'coin', data: c, z: c.z }))
    ].sort((a, b) => b.z - a.z);

    allItems.forEach(item => {
        if (item.type === 'obs') drawObstacle(item.data);
        else drawCoin(item.data);
    });

    drawMotorcycle();
    drawSparks();
    drawHUD();

    if (state === 'menu') drawMenu();
    if (state === 'over') drawGameOver();
}

canvas.addEventListener('click', e => {
    const x = e.clientX, y = e.clientY;
    if (state === 'menu') {
        if (y > H * 0.78 && y < H * 0.86 && x > cx - 120 && x < cx + 120) {
            state = 'play';
            resetGame();
        }
    } else if (state === 'over') {
        if (y > H * 0.62 && y < H * 0.7 && x > cx - 100 && x < cx + 100) {
            state = 'play';
            resetGame();
        }
    }
});

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
