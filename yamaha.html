<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yamaha Racing 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Arial Black',sans-serif}
canvas{position:fixed;top:0;left:0;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; cx = W / 2; }
resize();
window.addEventListener('resize', resize);

const keys = {};
window.addEventListener('keydown', e => { keys[e.code] = true; if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault(); });
window.addEventListener('keyup', e => { keys[e.code] = false; });

const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function ensureAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }

const SFX = {
    engine: null, boost: null, coin: null, crash: null, click: null, win: null
};

function initSFX() {
    ensureAudio();
    SFX.engine = createEngineSound();
}

function createEngineSound() {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();
    osc.type = 'sawtooth';
    osc.frequency.value = 60;
    filter.type = 'lowpass';
    filter.frequency.value = 300;
    gain.gain.value = 0;
    osc.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    return { osc, gain, filter };
}

function updateEngineSound(speed, maxSpeed) {
    if (!SFX.engine || !audioCtx) return;
    const ratio = speed / maxSpeed;
    SFX.engine.osc.frequency.value = 50 + ratio * 120;
    SFX.engine.filter.frequency.value = 200 + ratio * 800;
    SFX.engine.gain.gain.value = Math.min(0.06, 0.01 + ratio * 0.05);
}

function stopEngineSound() {
    if (SFX.engine) SFX.engine.gain.gain.value = 0;
}

function playTone(freq, dur, type, vol, slide) {
    ensureAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    if (slide) osc.frequency.linearRampToValueAtTime(slide, audioCtx.currentTime + dur);
    gain.gain.value = vol || 0.1;
    gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
}

function sfxCoin() { playTone(880, 0.1, 'sine', 0.08); playTone(1320, 0.15, 'sine', 0.06); }
function sfxCrash() { playTone(100, 0.3, 'sawtooth', 0.15, 30); }
function sfxBoost() { playTone(200, 0.5, 'sawtooth', 0.05, 600); }
function sfxClick() { playTone(600, 0.05, 'sine', 0.04); }
function sfxUpgrade() { playTone(440, 0.1, 'sine', 0.06); playTone(660, 0.1, 'sine', 0.06); playTone(880, 0.15, 'sine', 0.06); }

const TRACKS = {
    city: {
        name: 'НОЧНОЙ ГОРОД',
        skyTop: '#050510', skyBot: '#0a0a2a',
        road: '#1a1a28', roadEdge: '#00ff88',
        fogColor: '#0a0a1a',
        buildColors: ['#0a1520', '#0c1828', '#0e1a2c'],
        windowColor: '#ffffaa',
        groundColor: '#060612',
        starCount: 60, moonX: 0.8, moonY: 0.12,
        objColor1: '#111825', objColor2: '#0d1520'
    },
    mountains: {
        name: 'ГОРНЫЙ ПЕРЕВАЛ',
        skyTop: '#1a0a2a', skyBot: '#2a1540',
        road: '#2a2218', roadEdge: '#ff8844',
        fogColor: '#1a1520',
        buildColors: ['#1a2a18', '#1c2c1a', '#1e2e1c'],
        windowColor: '#ffcc88',
        groundColor: '#0a1208',
        starCount: 40, moonX: 0.75, moonY: 0.15,
        objColor1: '#1a2818', objColor2: '#152212'
    },
    desert: {
        name: 'ПУСТЫННЫЙ БЕГ',
        skyTop: '#1a1005', skyBot: '#2a1a08',
        road: '#2a2015', roadEdge: '#ffaa00',
        fogColor: '#1a1508',
        buildColors: ['#2a2010', '#282212', '#262414'],
        windowColor: '#ffeeaa',
        groundColor: '#120e06',
        starCount: 30, moonX: 0.85, moonY: 0.1,
        objColor1: '#221a08', objColor2: '#1e1606'
    }
};

const MODES = {
    arcade: { name: 'АРКАДА', accelMod: 1.2, maxSpeedMod: 1.1, obstacleMod: 0.8, livesMod: 1, boostMod: 1.2, desc: 'Быстро и весело!' },
    realistic: { name: 'РЕАЛИСТ', accelMod: 0.6, maxSpeedMod: 0.75, obstacleMod: 1.3, livesMod: 1, boostMod: 0.8, desc: 'Сложно и серьёзно' },
    timer: { name: 'НА ВРЕМЯ', accelMod: 1.0, maxSpeedMod: 1.0, obstacleMod: 0.5, livesMod: 99, boostMod: 1.0, desc: '60 секунд, максимум очков' }
};

let save = JSON.parse(localStorage.getItem('yamahaSave') || '{}');
if (!save.coins) save.coins = 0;
if (!save.upgrades) save.upgrades = { speed: 0, handling: 0, boostCap: 0, armor: 0 };
if (!save.best) save.best = {};
if (!save.track) save.track = 'city';
if (!save.mode) save.mode = 'arcade';
function saveGame() { localStorage.setItem('yamahaSave', JSON.stringify(save)); }

const UPGRADES = {
    speed: { name: 'СКОРОСТЬ', icon: '⚡', max: 5, cost: [100, 250, 500, 1000, 2000], desc: '+10% макс. скорость' },
    handling: { name: 'УПРАВЛЕНИЕ', icon: '🎯', max: 5, cost: [80, 200, 400, 800, 1600], desc: '+15% отзывчивость' },
    boostCap: { name: 'БУСТ', icon: '🔥', max: 5, cost: [120, 300, 600, 1200, 2400], desc: '+20% топливо буста' },
    armor: { name: 'БРОНЯ', icon: '🛡', max: 3, cost: [200, 500, 1200], desc: '1 fewer damage taken' }
};

let state = 'menu';
let track = 'city';
let mode = 'arcade';
let score = 0, lives = 3, dist = 0, timeLeft = 60;
let speed = 0, playerX = 0, targetX = 0;
let boost = 100, maxBoost = 100;
let roadOffset = 0, invTimer = 0;
let obstacles = [], coins = [], sparks = [], clouds = [];
let menuPage = 'main';
let hoverBtn = null;
let resultCoins = 0;

const roadW = 220;
const laneCount = 3;
const laneW = roadW / laneCount;
const groundY = () => H;

function getTrack() { return TRACKS[track]; }
function getMode() { return MODES[mode]; }

function getMaxSpeed() {
    const base = 18;
    const upg = save.upgrades.speed * 2;
    return (base + upg) * getMode().maxSpeedMod;
}
function getAccel() {
    const base = 0.12;
    const upg = save.upgrades.handling * 0.015;
    return (base + upg) * getMode().accelMod;
}
function getBoostMax() {
    const base = 100;
    return base + save.upgrades.boostCap * 20;
}

function resetGame() {
    score = 0; lives = 3; dist = 0; timeLeft = 60;
    speed = 0; playerX = 0; targetX = 0;
    maxBoost = getBoostMax();
    boost = maxBoost;
    roadOffset = 0; invTimer = 0;
    obstacles = []; coins = []; sparks = [];
}

function toScreen(objZ, objX, objY) {
    const t = 1 - (objZ / 600);
    if (t <= 0) return null;
    const gY = groundY();
    const vy = gY * 0.32;
    const sx = cx + objX * t * 2.2;
    const sy = vy + (gY - vy) * t;
    return { x: sx, y: sy, s: t * 2, t };
}

function spawnObstacle() {
    const lane = Math.floor(Math.random() * laneCount) - 1;
    const r = Math.random();
    const type = r < 0.3 ? 'cone' : (r < 0.6 ? 'barrier' : 'oil');
    obstacles.push({ z: 600, lane, type, w: type === 'barrier' ? 40 : 20 });
}

function spawnCoin() {
    const lane = Math.floor(Math.random() * laneCount) - 1;
    coins.push({ z: 600, lane });
}

function addSpark(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        sparks.push({
            x, y, vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8 - 2,
            life: 1, color, size: 2 + Math.random() * 4
        });
    }
}

function update() {
    if (state !== 'play') return;

    const mx = getMaxSpeed();
    const ac = getAccel();
    const trk = getTrack();

    if (keys['ArrowUp'] || keys['KeyW']) speed = Math.min(speed + ac, mx);
    else if (keys['ArrowDown'] || keys['KeyS']) speed = Math.max(speed - ac * 2, 0);
    else speed = Math.max(speed - 0.02, 0.5);

    if ((keys['Space'] || keys['ShiftLeft']) && boost > 0) {
        if (!boosting) sfxBoost();
        boosting = true;
        speed = Math.min(speed + 0.3, mx * 1.6);
        boost -= 0.8;
        if (Math.random() > 0.5) {
            const p = toScreen(0, playerX, 0);
            if (p) addSpark(p.x - 15 * p.s, p.y - 5 * p.s, '#ff6600', 1);
        }
    } else {
        boosting = false;
        boost = Math.min(boost + 0.15, maxBoost);
    }

    const hMod = save.upgrades.handling * 0.5 + 3;
    if (keys['ArrowLeft'] || keys['KeyA']) targetX = Math.max(targetX - hMod, -laneW);
    if (keys['ArrowRight'] || keys['KeyD']) targetX = Math.min(targetX + hMod, laneW);
    playerX += (targetX - playerX) * 0.15;

    roadOffset += speed * 4;
    dist += speed * 0.5;
    score += Math.floor(speed * 0.5);
    if (invTimer > 0) invTimer--;

    if (mode === 'timer') {
        timeLeft -= 1 / 60;
        if (timeLeft <= 0) {
            timeLeft = 0;
            state = 'over';
            if (!save.best[track + '_' + mode] || score > save.best[track + '_' + mode]) save.best[track + '_' + mode] = score;
            resultCoins = Math.floor(score / 10);
            save.coins += resultCoins;
            saveGame();
            stopEngineSound();
            return;
        }
    }

    const obsChance = 0.015 + speed * 0.001 * getMode().obstacleMod;
    if (Math.random() < obsChance) spawnObstacle();
    if (Math.random() < 0.025) spawnCoin();

    const gY = groundY();
    const playerSX = cx + playerX * 2.2;
    const playerSY = gY - 55;
    const playerR = 28;

    obstacles = obstacles.filter(o => {
        o.z -= speed * 5;
        if (o.z < 0) return false;
        if (o.z < 40) {
            const p = toScreen(o.z, o.lane * laneW, 0);
            if (p) {
                const dx = playerSX - p.x;
                const dy = playerSY - p.y;
                if (Math.sqrt(dx * dx + dy * dy) < playerR + o.w * p.s * 0.4) {
                    if (invTimer <= 0) {
                        const dmg = save.upgrades.armor >= 2 ? 0 : 1;
                        if (dmg > 0) {
                            lives -= dmg;
                            sfxCrash();
                            addSpark(playerSX, playerSY, '#ff4444', 15);
                        } else {
                            addSpark(playerSX, playerSY, '#8888ff', 8);
                        }
                        invTimer = 60;
                        if (lives <= 0) {
                            lives = 0;
                            state = 'over';
                            if (!save.best[track + '_' + mode] || score > save.best[track + '_' + mode]) save.best[track + '_' + mode] = score;
                            resultCoins = Math.floor(score / 10);
                            save.coins += resultCoins;
                            saveGame();
                            stopEngineSound();
                        }
                    }
                    return false;
                }
            }
        }
        return true;
    });

    coins = coins.filter(c => {
        c.z -= speed * 5;
        if (c.z < 0) return false;
        if (c.z < 40) {
            const p = toScreen(c.z, c.lane * laneW, 0);
            if (p) {
                const dx = playerSX - p.x;
                const dy = (playerSY - 20) - p.y;
                if (Math.sqrt(dx * dx + dy * dy) < playerR + 18 * p.s) {
                    score += 100;
                    sfxCoin();
                    addSpark(p.x, p.y, '#ffaa00', 10);
                    return false;
                }
            }
        }
        return true;
    });

    sparks = sparks.filter(s => {
        s.x += s.vx; s.y += s.vy; s.vy += 0.2; s.life -= 0.03;
        return s.life > 0;
    });

    updateEngineSound(speed, mx);
}

function drawSky(t) {
    const vy = groundY() * 0.32;
    const g = ctx.createLinearGradient(0, 0, 0, vy);
    g.addColorStop(0, t.skyTop);
    g.addColorStop(1, t.skyBot);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, vy + 30);

    for (let i = 0; i < t.starCount; i++) {
        const sx = ((i * 173.7 + 50) % W);
        const sy = ((i * 91.3 + 20) % (vy - 10));
        ctx.fillStyle = `rgba(255,255,255,${0.2 + Math.sin(Date.now() * 0.001 + i) * 0.3})`;
        ctx.fillRect(sx, sy, 1.5, 1.5);
    }

    const mx = W * t.moonX, my = H * t.moonY;
    ctx.fillStyle = '#eeeeff';
    ctx.shadowColor = '#eeeeff';
    ctx.shadowBlur = 30;
    ctx.beginPath(); ctx.arc(mx, my, 25, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = t.skyTop;
    ctx.beginPath(); ctx.arc(mx + 10, my - 5, 22, 0, Math.PI * 2); ctx.fill();
}

function drawGround(t) {
    const vy = groundY() * 0.32;
    ctx.fillStyle = t.groundColor;
    ctx.beginPath();
    ctx.moveTo(0, vy + 20);
    for (let x = 0; x <= W; x += 40) ctx.lineTo(x, vy + 10 + Math.sin(x * 0.02) * 15);
    ctx.lineTo(W, vy + 60); ctx.lineTo(0, vy + 60);
    ctx.fill();
}

function drawBuildings(t) {
    const gY = groundY();
    for (let side = -1; side <= 1; side += 2) {
        for (let i = 0; i < 25; i++) {
            const bz = (i * 80 + roadOffset * 0.3) % 2000;
            const p = toScreen(bz, side * (roadW / 2 + 60 + Math.sin(i) * 30), 0);
            if (!p || p.t < 0.05) continue;
            const bw = 35 * p.s;
            const bh = (80 + (i % 3) * 40) * p.s;
            ctx.fillStyle = t.buildColors[i % 3];
            ctx.fillRect(p.x - bw / 2, p.y - bh, bw, bh);
            ctx.fillStyle = t.windowColor;
            ctx.globalAlpha = 0.15 + Math.sin(Date.now() * 0.002 + i) * 0.1;
            for (let wy = 0; wy < 4; wy++) {
                for (let wx = 0; wx < 2; wx++) {
                    ctx.fillRect(p.x - bw / 2 + 4 + wx * bw * 0.45, p.y - bh + 6 + wy * bh * 0.22, bw * 0.3, bh * 0.15);
                }
            }
            ctx.globalAlpha = 1;
        }
    }
}

function drawRoad(t) {
    const gY = groundY();
    const vy = gY * 0.32;
    const roadGrad = ctx.createLinearGradient(0, vy, 0, gY);
    roadGrad.addColorStop(0, t.road);
    roadGrad.addColorStop(1, t.road + 'cc');
    ctx.fillStyle = roadGrad;
    ctx.beginPath();
    ctx.moveTo(cx - 8, vy);
    ctx.lineTo(cx - roadW / 2 - 8, gY);
    ctx.lineTo(cx + roadW / 2 + 8, gY);
    ctx.lineTo(cx + 8, vy);
    ctx.fill();

    ctx.strokeStyle = t.roadEdge;
    ctx.lineWidth = 3;
    ctx.shadowColor = t.roadEdge;
    ctx.shadowBlur = 15;
    ctx.beginPath(); ctx.moveTo(cx - 10, vy); ctx.lineTo(cx - roadW / 2 - 12, gY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + 10, vy); ctx.lineTo(cx + roadW / 2 + 12, gY); ctx.stroke();
    ctx.shadowBlur = 0;

    for (let i = 0; i < 30; i++) {
        const lz = (i * 60 + roadOffset) % 1800;
        const p = toScreen(lz, 0, 0);
        if (!p || p.t < 0.05) continue;
        ctx.fillStyle = `rgba(255,255,255,${p.t * 0.6})`;
        ctx.fillRect(p.x - p.s, p.y, 2 * p.s, 15 * p.s);
    }
}

function drawMotorcycle() {
    const gY = groundY();
    const sx = cx + playerX * 2.2;
    const sy = gY - 55;
    const tilt = (targetX - playerX) * 0.012;

    if (invTimer > 0 && Math.floor(invTimer / 3) % 2 === 0) return;

    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(tilt);

    ctx.fillStyle = 'rgba(0,255,136,0.12)';
    ctx.beginPath(); ctx.ellipse(0, 42, 35, 7, 0, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.ellipse(0, 32, 18, 22, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#00ff88'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, 32, 12, 16, 0, 0, Math.PI * 2); ctx.stroke();

    ctx.fillStyle = '#222';
    ctx.fillRect(-3, 15, 6, 34);

    ctx.fillStyle = '#002288';
    ctx.beginPath();
    ctx.moveTo(-22, 20); ctx.lineTo(-18, -10); ctx.lineTo(-8, -28);
    ctx.lineTo(8, -28); ctx.lineTo(18, -10); ctx.lineTo(22, 20);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = '#00ff88';
    ctx.fillRect(-16, -2, 32, 3);

    ctx.fillStyle = '#0033aa';
    ctx.beginPath(); ctx.ellipse(0, -8, 14, 10, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#00ff88';
    ctx.font = 'bold 10px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('Y', 0, -8);

    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.moveTo(-10, -28); ctx.quadraticCurveTo(0, -42, 10, -28);
    ctx.lineTo(8, -28); ctx.quadraticCurveTo(0, -36, -8, -28);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.ellipse(0, -36, 7, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#00ff88';
    ctx.beginPath(); ctx.ellipse(0, -35, 4, 4, 0, Math.PI, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.moveTo(-6, -18); ctx.lineTo(-8, -6); ctx.lineTo(-4, 0);
    ctx.lineTo(4, 0); ctx.lineTo(8, -6); ctx.lineTo(6, -18);
    ctx.closePath(); ctx.fill();

    const brB = speed < 2 ? 1 : 0.4;
    ctx.fillStyle = `rgba(255,20,20,${brB})`;
    ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 12 * brB;
    ctx.beginPath(); ctx.ellipse(-14, 18, 4, 3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(14, 18, 4, 3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(-10, 16, 20, 3);
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#0044cc';
    ctx.beginPath(); ctx.moveTo(-20, 20); ctx.lineTo(-16, 24); ctx.lineTo(-12, 22); ctx.lineTo(-8, 20); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(20, 20); ctx.lineTo(16, 24); ctx.lineTo(12, 22); ctx.lineTo(8, 20); ctx.closePath(); ctx.fill();

    ctx.fillStyle = '#ffffaa';
    ctx.shadowColor = '#ffffaa'; ctx.shadowBlur = 15;
    ctx.beginPath(); ctx.ellipse(0, -44, 3, 2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;

    if (boosting && boost > 0) {
        for (let i = 0; i < 2; i++) {
            const ox = (i === 0) ? -12 : 12;
            const fl = 20 + Math.random() * 25;
            const fg = ctx.createLinearGradient(ox, 44, ox, 44 + fl);
            fg.addColorStop(0, 'rgba(255,200,0,0.9)');
            fg.addColorStop(0.4, 'rgba(255,100,0,0.6)');
            fg.addColorStop(1, 'rgba(255,50,0,0)');
            ctx.fillStyle = fg;
            ctx.beginPath(); ctx.moveTo(ox - 4, 44); ctx.lineTo(ox, 44 + fl); ctx.lineTo(ox + 4, 44); ctx.closePath(); ctx.fill();
        }
    }

    ctx.restore();
}

function drawObstacle(o) {
    const p = toScreen(o.z, o.lane * laneW, 0);
    if (!p || p.t < 0.05) return;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.scale(p.s, p.s);
    if (o.type === 'barrier') {
        ctx.fillStyle = '#cc2222';
        ctx.fillRect(-20, -25, 40, 25);
        ctx.fillStyle = '#fff';
        for (let i = 0; i < 4; i++) ctx.fillRect(-18 + i * 10, -24, 5, 23);
    } else if (o.type === 'cone') {
        ctx.fillStyle = '#ff8800';
        ctx.beginPath(); ctx.moveTo(0, -35); ctx.lineTo(-10, 0); ctx.lineTo(10, 0); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.fillRect(-7, -18, 14, 4);
        ctx.fillRect(-5, -8, 10, 4);
    } else {
        ctx.fillStyle = 'rgba(20,20,20,0.8)';
        ctx.beginPath(); ctx.ellipse(0, 0, 18, 6, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
}

function drawCoin(c) {
    const p = toScreen(c.z, c.lane * laneW, 15);
    if (!p || p.t < 0.05) return;
    const pulse = 1 + Math.sin(Date.now() * 0.005) * 0.15;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.scale(p.s * pulse, p.s * pulse);
    ctx.shadowColor = '#ffaa00'; ctx.shadowBlur = 15;
    ctx.fillStyle = '#ffaa00';
    ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffcc44';
    ctx.beginPath(); ctx.arc(-1, -1, 6, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#0033aa';
    ctx.font = 'bold 9px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('Y', 0, 1);
    ctx.restore();
}

function drawSparks() {
    sparks.forEach(s => {
        ctx.globalAlpha = s.life;
        ctx.fillStyle = s.color;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.size * s.life, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;
}

function drawHUD() {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.beginPath(); ctx.roundRect(W - 170, H - 170, 140, 140, 70); ctx.fill();
    ctx.strokeStyle = '#00ff88'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(W - 100, H - 100, 65, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#00ff88';
    ctx.font = 'bold 38px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(Math.floor(speed * 10), W - 100, H - 108);
    ctx.fillStyle = '#00aa55'; ctx.font = '12px Arial';
    ctx.fillText('KM/H', W - 100, H - 78);

    ctx.textAlign = 'right'; ctx.fillStyle = '#fff'; ctx.font = 'bold 22px Arial';
    ctx.fillText('ОЧКИ: ' + score, W - 25, 40);
    ctx.fillStyle = '#aaa'; ctx.font = '16px Arial';
    ctx.fillText(dist.toFixed(0) + 'm', W - 25, 65);

    if (mode === 'timer') {
        ctx.fillStyle = timeLeft < 10 ? '#ff4444' : '#ffaa00';
        ctx.font = 'bold 28px Arial'; ctx.textAlign = 'center';
        ctx.fillText(Math.ceil(timeLeft) + 'с', W / 2, 40);
    }

    const maxL = getMode().livesMod === 99 ? 5 : lives;
    const showLives = getMode().livesMod === 99 ? maxL : lives;
    for (let i = 0; i < showLives; i++) {
        ctx.font = '24px Arial'; ctx.textAlign = 'left';
        ctx.fillText('❤', 25 + i * 30, 35);
    }

    ctx.fillStyle = 'rgba(255,100,0,0.2)';
    ctx.fillRect(25, H - 55, 150, 14);
    ctx.strokeStyle = '#ff6600'; ctx.lineWidth = 2;
    ctx.strokeRect(25, H - 55, 150, 14);
    const bg = ctx.createLinearGradient(25, 0, 175, 0);
    bg.addColorStop(0, '#ff3300'); bg.addColorStop(1, '#ffaa00');
    ctx.fillStyle = bg;
    ctx.fillRect(25, H - 55, (boost / maxBoost) * 150, 14);
    ctx.fillStyle = '#ff6600'; ctx.font = '11px Arial'; ctx.textAlign = 'left';
    ctx.fillText('TURBO [SPACE]', 30, H - 62);

    if (boosting) {
        ctx.fillStyle = `rgba(255,100,0,${0.05 + Math.random() * 0.05})`;
        ctx.fillRect(0, 0, W, H);
    }
}

function drawRoundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

function btn(x, y, w, h, text, id) {
    const mx = mouseX, my = mouseY;
    const hover = mx > x && mx < x + w && my > y && my < y + h;
    if (hover) hoverBtn = id;
    ctx.fillStyle = hover ? 'rgba(0,255,136,0.25)' : 'rgba(0,255,136,0.1)';
    drawRoundRect(x, y, w, h, 12);
    ctx.fill();
    ctx.strokeStyle = '#00ff88'; ctx.lineWidth = hover ? 3 : 2;
    ctx.stroke();
    ctx.fillStyle = '#00ff88';
    ctx.font = `bold ${Math.min(20, h * 0.4)}px Arial`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, x + w / 2, y + h / 2);
    return hover;
}

let mouseX = 0, mouseY = 0;
canvas.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
canvas.addEventListener('click', e => {
    ensureAudio();
    mouseX = e.clientX; mouseY = e.clientY;

    if (state === 'menu') {
        if (menuPage === 'main') {
            if (btnHit(cx - 160, H * 0.45, 140, 50)) { menuPage = 'play'; sfxClick(); }
            if (btnHit(cx + 20, H * 0.45, 140, 50)) { menuPage = 'shop'; sfxClick(); }
            if (btnHit(cx - 70, H * 0.58, 140, 50)) { menuPage = 'tracks'; sfxClick(); }
        } else if (menuPage === 'play') {
            if (btnHit(cx - 150, H * 0.55, 130, 45)) { mode = 'arcade'; sfxClick(); }
            if (btnHit(cx - 10, H * 0.55, 130, 45)) { mode = 'realistic'; sfxClick(); }
            if (btnHit(cx + 130, H * 0.55, 130, 45)) { mode = 'timer'; sfxClick(); }
            if (btnHit(cx - 80, H * 0.72, 160, 55)) {
                state = 'play'; resetGame(); sfxClick();
                if (!audioCtx) initSFX(); else ensureAudio();
            }
            if (btnHit(20, H - 60, 100, 40)) { menuPage = 'main'; sfxClick(); }
        } else if (menuPage === 'shop') {
            const keys = ['speed', 'handling', 'boostCap', 'armor'];
            keys.forEach((k, i) => {
                const uy = H * 0.28 + i * 65;
                if (save.upgrades[k] < UPGRADES[k].max) {
                    if (btnHit(cx + 100, uy, 90, 45)) {
                        const cost = UPGRADES[k].cost[save.upgrades[k]];
                        if (save.coins >= cost) {
                            save.coins -= cost;
                            save.upgrades[k]++;
                            saveGame();
                            sfxUpgrade();
                        }
                    }
                }
            });
            if (btnHit(20, H - 60, 100, 40)) { menuPage = 'main'; sfxClick(); }
        } else if (menuPage === 'tracks') {
            const trkKeys = ['city', 'mountains', 'desert'];
            trkKeys.forEach((k, i) => {
                if (btnHit(cx - 150 + i * 140, H * 0.45, 120, 60)) { track = k; sfxClick(); }
            });
            if (btnHit(cx - 80, H * 0.72, 160, 55)) { menuPage = 'main'; sfxClick(); }
            if (btnHit(20, H - 60, 100, 40)) { menuPage = 'main'; sfxClick(); }
        }
    } else if (state === 'over') {
        if (btnHit(cx - 80, H * 0.62, 160, 55)) {
            state = 'play'; resetGame(); sfxClick();
        }
        if (btnHit(cx - 80, H * 0.74, 160, 45)) {
            state = 'menu'; menuPage = 'main'; sfxClick(); stopEngineSound();
        }
    }
});

function btnHit(x, y, w, h) {
    return mouseX > x && mouseX < x + w && mouseY > y && mouseY < y + h;
}

function drawMenu() {
    ctx.fillStyle = 'rgba(0,0,0,0.88)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#00ff88';
    ctx.shadowColor = '#00ff88'; ctx.shadowBlur = 40;
    ctx.font = 'bold 72px Arial';
    ctx.fillText('YAMAHA', cx, H * 0.18);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#00aa55'; ctx.font = '22px Arial';
    ctx.fillText('SPEED RACING 3D', cx, H * 0.24);

    ctx.fillStyle = '#ffaa00'; ctx.font = 'bold 18px Arial';
    ctx.fillText('💰 ' + save.coins, cx, H * 0.3);

    hoverBtn = null;

    if (menuPage === 'main') {
        btn(cx - 160, H * 0.45, 140, 50, '▶ ИГРАТЬ');
        btn(cx + 20, H * 0.45, 140, 50, '🛒 МАГАЗИН');
        btn(cx - 70, H * 0.58, 140, 50, '🗺 ТРЕКИ');

        const bk = track + '_' + mode;
        if (save.best[bk]) {
            ctx.fillStyle = '#888'; ctx.font = '14px Arial';
            ctx.fillText('Лучший (' + MODES[mode].name + ' / ' + TRACKS[track].name + '): ' + save.best[bk], cx, H * 0.72);
        }
    } else if (menuPage === 'play') {
        ctx.fillStyle = '#ccc'; ctx.font = 'bold 20px Arial';
        ctx.fillText('ВЫБЕРИ РЕЖИМ', cx, H * 0.4);

        btn(cx - 150, H * 0.55, 130, 45, 'АРКАДА');
        btn(cx - 10, H * 0.55, 130, 45, 'РЕАЛИСТ');
        btn(cx + 130, H * 0.55, 130, 45, 'НА ВРЕМЯ');

        const md = MODES[mode];
        ctx.fillStyle = '#00ff88'; ctx.font = 'bold 16px Arial';
        ctx.fillText('▸ ' + md.name, cx, H * 0.65);
        ctx.fillStyle = '#aaa'; ctx.font = '14px Arial';
        ctx.fillText(md.desc, cx, H * 0.69);

        btn(cx - 80, H * 0.72, 160, 55, 'СТАРТ');
        btn(20, H - 60, 100, 40, '← НАЗАД');
    } else if (menuPage === 'shop') {
        ctx.fillStyle = '#ccc'; ctx.font = 'bold 20px Arial';
        ctx.fillText('МАГАЗИН УЛУЧШЕНИЙ', cx, H * 0.2);

        const keys = ['speed', 'handling', 'boostCap', 'armor'];
        keys.forEach((k, i) => {
            const u = UPGRADES[k];
            const uy = H * 0.28 + i * 65;
            const lv = save.upgrades[k];

            ctx.fillStyle = '#aaa'; ctx.font = '14px Arial'; ctx.textAlign = 'left';
            ctx.fillText(u.icon + ' ' + u.name, cx - 180, uy + 18);
            ctx.fillStyle = '#666'; ctx.font = '12px Arial';
            ctx.fillText(u.desc, cx - 180, uy + 35);

            for (let j = 0; j < u.max; j++) {
                ctx.fillStyle = j < lv ? '#00ff88' : '#333';
                ctx.fillRect(cx - 20 + j * 22, uy + 5, 18, 12);
            }

            if (lv < u.max) {
                const cost = u.cost[lv];
                const canBuy = save.coins >= cost;
                btn(cx + 100, uy, 90, 45, (canBuy ? '💰' : '🔒') + ' ' + cost);
            } else {
                ctx.fillStyle = '#00ff88'; ctx.font = 'bold 14px Arial'; ctx.textAlign = 'center';
                ctx.fillText('МАКС', cx + 145, uy + 22);
            }
        });
        ctx.textAlign = 'center';
        btn(20, H - 60, 100, 40, '← НАЗАД');
    } else if (menuPage === 'tracks') {
        ctx.fillStyle = '#ccc'; ctx.font = 'bold 20px Arial';
        ctx.fillText('ВЫБЕРИ ТРЕК', cx, H * 0.35);

        const trkKeys = ['city', 'mountains', 'desert'];
        trkKeys.forEach((k, i) => {
            const tx = cx - 150 + i * 140;
            const t = TRACKS[k];
            const sel = track === k;

            ctx.fillStyle = sel ? 'rgba(0,255,136,0.3)' : 'rgba(255,255,255,0.05)';
            drawRoundRect(tx, H * 0.45, 120, 60, 10);
            ctx.fill();
            ctx.strokeStyle = sel ? '#00ff88' : '#444'; ctx.lineWidth = sel ? 3 : 1;
            ctx.stroke();

            ctx.fillStyle = sel ? '#00ff88' : '#aaa'; ctx.font = 'bold 14px Arial';
            ctx.fillText(t.name, tx + 60, H * 0.45 + 35);
        });

        btn(cx - 80, H * 0.72, 160, 55, 'ГОТОВО');
        btn(20, H - 60, 100, 40, '← НАЗАД');
    }
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.9)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff4444';
    ctx.shadowColor = '#ff4444'; ctx.shadowBlur = 30;
    ctx.font = 'bold 64px Arial';
    ctx.fillText(mode === 'timer' ? 'ВРЕМЯ!' : 'АВАРИЯ!', cx, H * 0.25);
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#00ff88'; ctx.font = 'bold 40px Arial';
    ctx.fillText('ОЧКИ: ' + score, cx, H * 0.38);

    ctx.fillStyle = '#ffaa00'; ctx.font = 'bold 22px Arial';
    ctx.fillText('💰 +' + resultCoins + ' монет', cx, H * 0.46);

    const bk = track + '_' + mode;
    if (score >= (save.best[bk] || 0) && score > 0) {
        ctx.fillStyle = '#ffaa00'; ctx.font = 'bold 20px Arial';
        ctx.fillText('🏆 НОВЫЙ РЕКОРД!', cx, H * 0.53);
    }

    btn(cx - 80, H * 0.62, 160, 55, 'ЗАНОВО');
    btn(cx - 80, H * 0.74, 160, 45, 'В МЕНЮ');
}

function draw() {
    ctx.clearRect(0, 0, W, H);
    const t = getTrack();

    drawSky(t);
    drawGround(t);
    drawBuildings(t);
    drawRoad(t);

    const allItems = [
        ...obstacles.map(o => ({ type: 'obs', data: o, z: o.z })),
        ...coins.map(c => ({ type: 'coin', data: c, z: c.z }))
    ].sort((a, b) => b.z - a.z);

    allItems.forEach(item => {
        if (item.type === 'obs') drawObstacle(item.data);
        else drawCoin(item.data);
    });

    if (state === 'play') {
        drawMotorcycle();
        drawSparks();
        drawHUD();
    }

    if (state === 'menu') drawMenu();
    if (state === 'over') { drawMotorcycle(); drawGameOver(); }
}

let boosting = false;

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
