<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Пурляу среди Звёзд!</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Courier New', monospace; }
canvas { border: 2px solid #333; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const C = document.getElementById('c');
const X = C.getContext('2d');
C.width = 800; C.height = 500;

const G = {
  state: 'title', level: 0, lives: 3, score: 0,
  px: 100, py: 350, pvx: 0, pvy: 0, onGround: false, facing: 1, frame: 0, frameT: 0,
  bullets: [], enemies: [], stars: [], platforms: [], particles: [], pickups: [],
  portal: null, shake: 0, transition: 0, transDir: 1,
  storyText: '', storyTimer: 0, storyQueue: [],
  keys: {}, time: 0, levelTime: 0
};

const LEVELS = [
  { name: "Рождение Звезды", story: ["ПУРЛЯУ! Ты просыпаешься в туманности Ориона!", "Новые звёзды рождаются вокруг! СПАСАЙСЯ!"], bg: [10, 5, 25], starColor: '#ff6633' },
  { name: "Танец Протуберанцев", story: ["УХ ТЫ! Протуберанцы взрываются!"], bg: [15, 5, 10], starColor: '#ff3300' },
  { name: "Чёрная Дыра", story: ["О нет! Гравитация невероятна! ДЕРЖИСЬ!"], bg: [5, 0, 15], starColor: '#9933ff' },
  { name: "Кольца Сатурна", story: ["КАКАЯ КРАСОТА! Кольца из льда и камня!"], bg: [5, 10, 20], starColor: '#ccaa66' },
  { name: "Млечный Путь", story: ["Мы внутри галактики! ОГОНЬ ПОЛНЫЙ!"], bg: [5, 5, 15], starColor: '#aaccff' },
  { name: "Сверхновая!", story: ["БУУУМ! Сверхновая взорвалась! БЕГИ!!!"], bg: [25, 10, 5], starColor: '#ffff00' },
  { name: "Пульсар", story: ["Бззз! Пульсар стреляет лучами! ОСТОРОЖНО!"], bg: [0, 10, 20], starColor: '#00ffff' },
  { name: "Туманность Краба", story: ["КАКАО! Это остатки сверхновой! ВАУ!"], bg: [20, 5, 10], starColor: '#ff6600' },
  { name: "Созвездие Дракона", story: ["ДРАКОН! Нет, подожди... это созвездие! УФФ!"], bg: [5, 5, 20], starColor: '#6699ff' },
  { name: "Врата Галактик", story: ["МЕГА КРУТО! Портал между галактиками!"], bg: [10, 0, 20], starColor: '#ff33ff' },
  { name: "Финал: Бесконечность", story: ["ПУРЛЯУ! Ты добрался! ВСЕЛЕННАЯ ТВОЯ!!!"], bg: [15, 15, 15], starColor: '#ffffff' }
];

function genLevel(n) {
  G.platforms = []; G.enemies = []; G.pickups = []; G.bullets = []; G.particles = []; G.stars = [];
  G.px = 100; G.py = 350; G.pvx = 0; G.pvy = 0;
  const l = LEVELS[n];
  // Stars background
  for (let i = 0; i < 120; i++) G.stars.push({ x: Math.random()*800, y: Math.random()*500, s: Math.random()*3+0.5, sp: Math.random()*2+0.5, c: l.starColor });
  // Platforms
  G.platforms.push({ x: 0, y: 420, w: 800, h: 80, c: '#223' });
  const platCount = 5 + n;
  for (let i = 0; i < platCount; i++) {
    G.platforms.push({
      x: 80 + Math.random()*620, y: 150 + Math.random()*230, w: 60 + Math.random()*80, h: 16,
      c: `hsl(${Math.random()*360}, 60%, ${30+Math.random()*20}%)`
    });
  }
  // Enemies
  const eCount = 2 + Math.floor(n * 0.8);
  for (let i = 0; i < eCount; i++) {
    G.enemies.push({
      x: 150 + Math.random()*500, y: 380, vx: (Math.random()>0.5?1:-1)*(1+n*0.2),
      w: 24, h: 24, hp: 1, type: Math.floor(Math.random()*3),
      frame: 0, frameT: 0
    });
  }
  // Pickups
  for (let i = 0; i < 3 + Math.floor(n/2); i++) {
    G.pickups.push({ x: 100 + Math.random()*600, y: 100 + Math.random()*280, w: 16, h: 16, type: Math.random()>0.3?'star':'heart', bob: Math.random()*Math.PI*2 });
  }
  // Portal
  G.portal = { x: 720, y: 360, w: 40, h: 60 };
  G.levelTime = 0;
}

function spawnParticle(x, y, c, count) {
  for (let i = 0; i < count; i++) G.particles.push({ x, y, vx: (Math.random()-0.5)*6, vy: (Math.random()-0.5)*6, life: 30+Math.random()*30, c, s: 2+Math.random()*4 });
}

function update() {
  if (G.state === 'title') { G.time++; return; }
  if (G.state === 'story') {
    G.storyTimer++;
    if (G.storyTimer > 120) {
      G.storyQueue.shift();
      G.storyTimer = 0;
      if (G.storyQueue.length === 0) G.state = 'play';
    }
    return;
  }
  if (G.state === 'gameover' || G.state === 'win') { G.time++; return; }
  G.time++; G.levelTime++;
  const spd = 4, grav = 0.5, jpow = -11;
  if (G.keys['ArrowLeft'] || G.keys['KeyA']) { G.pvx = -spd; G.facing = -1; }
  else if (G.keys['ArrowRight'] || G.keys['KeyD']) { G.pvx = spd; G.facing = 1; }
  else G.pvx *= 0.8;
  if ((G.keys['ArrowUp'] || G.keys['KeyW'] || G.keys['Space']) && G.onGround) { G.pvy = jpow; G.onGround = false; }
  G.pvy += grav;
  G.px += G.pvx; G.py += G.pvy;
  G.onGround = false;
  for (const p of G.platforms) {
    if (G.px+20 > p.x && G.px < p.x+p.w && G.py+40 > p.y && G.py+40 < p.y+p.h+10 && G.pvy >= 0) {
      G.py = p.y-40; G.pvy = 0; G.onGround = true;
    }
  }
  if (G.py > 500) { G.lives--; G.shake = 10; if (G.lives<=0) G.state='gameover'; else { G.px=100; G.py=350; G.pvy=0; } }
  if (G.px < 0) G.px = 0; if (G.px > 780) G.px = 780;
  // Enemies
  for (let i = G.enemies.length-1; i >= 0; i--) {
    const e = G.enemies[i];
    e.x += e.vx; e.frameT++;
    if (e.frameT > 8) { e.frame = (e.frame+1)%4; e.frameT = 0; }
    if (e.x < 0 || e.x > 776) e.vx *= -1;
    if (e.y < 400) e.y += 2;
    // Player collision
    if (Math.abs(G.px+10-e.x-12) < 24 && Math.abs(G.py+20-e.y-12) < 24) {
      if (G.pvy > 0 && G.py+40 < e.y+16) {
        G.enemies.splice(i,1); G.score += 100; G.pvy = jpow*0.6;
        spawnParticle(e.x, e.y, '#ff0', 15);
      } else {
        G.lives--; G.shake = 15; G.pvy = jpow*0.5;
        spawnParticle(G.px+10, G.py+20, '#f00', 10);
        if (G.lives <= 0) G.state = 'gameover';
        G.px = 100; G.py = 350; G.pvy = 0;
      }
    }
    for (let j = G.bullets.length-1; j >= 0; j--) {
      const b = G.bullets[j];
      if (Math.abs(b.x-e.x-12)<16 && Math.abs(b.y-e.y-12)<16) {
        G.enemies.splice(i,1); G.bullets.splice(j,1); G.score += 100;
        spawnParticle(e.x, e.y, '#ff6', 20); break;
      }
    }
  }
  // Pickups
  for (let i = G.pickups.length-1; i >= 0; i--) {
    const pk = G.pickups[i];
    if (Math.abs(G.px+10-pk.x-8)<20 && Math.abs(G.py+20-pk.y-8)<20) {
      G.pickups.splice(i,1);
      if (pk.type==='star') { G.score += 50; spawnParticle(pk.x, pk.y, '#ff0', 10); }
      else { G.lives = Math.min(G.lives+1, 5); spawnParticle(pk.x, pk.y, '#f55', 10); }
    }
  }
  // Portal
  if (G.portal && Math.abs(G.px+10-G.portal.x-20)<30 && Math.abs(G.py+20-G.portal.y-30)<30) {
    G.level++; G.score += 200;
    if (G.level >= LEVELS.length) { G.state = 'win'; } else { startLevel(G.level); }
  }
  // Particles
  for (let i = G.particles.length-1; i >= 0; i--) {
    const p = G.particles[i];
    p.x += p.vx; p.y += p.vy; p.life--;
    if (p.life <= 0) G.particles.splice(i,1);
  }
  // Screen shake
  if (G.shake > 0) G.shake--;
  // Frame
  G.frameT++; if (G.frameT > 6) { G.frame = (G.frame+1)%4; G.frameT = 0; }
}

function startLevel(n) {
  genLevel(n);
  G.state = 'story';
  G.storyQueue = [...LEVELS[n].story];
  G.storyTimer = 0;
}

function drawPlayer() {
  const sx = G.shake>0?(Math.random()-0.5)*G.shake*2:0;
  const sy = G.shake>0?(Math.random()-0.5)*G.shake*2:0;
  const px = G.px+sx, py = G.py+sy;
  // Body
  X.fillStyle = '#4af';
  X.fillRect(px, py+10, 20, 20);
  // Head
  X.fillStyle = '#fdd';
  X.fillRect(px+2, py, 16, 14);
  // Eyes
  X.fillStyle = '#000';
  X.fillRect(px+(G.facing>0?10:4), py+4, 4, 4);
  // Antenna
  X.fillStyle = '#ff0';
  X.fillRect(px+8, py-6, 4, 6);
  const glow = (Math.sin(G.time*0.2)+1)*0.5;
  X.fillStyle = `rgba(255,255,0,${glow})`;
  X.beginPath(); X.arc(px+10, py-8, 4, 0, Math.PI*2); X.fill();
  // Legs
  X.fillStyle = '#38c';
  const walk = G.onGround ? Math.sin(G.time*0.3)*3 : 2;
  X.fillRect(px+2, py+30, 6, 8+walk);
  X.fillRect(px+12, py+30, 6, 8-walk);
  // Jetpack
  X.fillStyle = '#888';
  X.fillRect(px-4, py+12, 4, 12);
  X.fillRect(px+20, py+12, 4, 12);
  if (!G.onGround) {
    X.fillStyle = `rgba(255,${100+Math.random()*155},0,${0.5+Math.random()*0.5})`;
    X.fillRect(px-3, py+24, 3, 6+Math.random()*8);
    X.fillRect(px+20, py+24, 3, 6+Math.random()*8);
  }
}

function drawEnemy(e) {
  const colors = ['#f44', '#4f4', '#f4f'];
  X.fillStyle = colors[e.type];
  X.fillRect(e.x, e.y+4, 24, 16);
  X.fillStyle = '#fff';
  X.fillRect(e.x+4, e.y+6, 4, 4);
  X.fillRect(e.x+16, e.y+6, 4, 4);
  X.fillStyle = '#000';
  const ex = Math.sin(G.time*0.1+e.x)*2;
  X.fillRect(e.x+5+ex, e.y+7, 2, 2);
  X.fillRect(e.x+17+ex, e.y+7, 2, 2);
  // Spikes
  X.fillStyle = colors[e.type];
  for (let i = 0; i < 3; i++) {
    X.beginPath();
    X.moveTo(e.x+4+i*8, e.y+4);
    X.lineTo(e.x+8+i*8, e.y-4+Math.sin(G.time*0.2+i)*2);
    X.lineTo(e.x+12+i*8, e.y+4);
    X.fill();
  }
}

function drawPortal(p) {
  const glow = (Math.sin(G.time*0.05)+1)*0.5;
  X.save();
  X.translate(p.x+p.w/2, p.y+p.h/2);
  for (let i = 3; i >= 0; i--) {
    X.fillStyle = `rgba(${150+i*30},${50+i*40},255,${0.2+glow*0.3-i*0.05})`;
    X.beginPath();
    X.ellipse(0, 0, p.w/2+i*5+Math.sin(G.time*0.1)*3, p.h/2+i*5+Math.cos(G.time*0.1)*3, 0, 0, Math.PI*2);
    X.fill();
  }
  X.fillStyle = `rgba(200,100,255,${0.8+glow*0.2})`;
  X.beginPath();
  X.ellipse(0, 0, 12, 20, 0, 0, Math.PI*2);
  X.fill();
  X.restore();
}

function draw() {
  const l = LEVELS[G.level] || LEVELS[0];
  X.fillStyle = `rgb(${l.bg[0]},${l.bg[1]},${l.bg[2]})`;
  X.fillRect(0, 0, 800, 500);

  // Stars
  for (const s of G.stars) {
    const flicker = (Math.sin(G.time*0.05+s.x)+1)*0.3+0.7;
    X.fillStyle = s.c;
    X.globalAlpha = flicker;
    X.fillRect(s.x, s.y, s.s, s.s);
    if (s.s > 2) {
      X.globalAlpha = flicker*0.3;
      X.fillRect(s.x-1, s.y-1, s.s+2, s.s+2);
    }
  }
  X.globalAlpha = 1;

  if (G.state === 'title') {
    drawTitle(); return;
  }
  if (G.state === 'story') { drawStory(); return; }
  if (G.state === 'gameover') { drawGameOver(); return; }
  if (G.state === 'win') { drawWin(); return; }

  // Platforms
  for (const p of G.platforms) {
    const grad = X.createLinearGradient(p.x, p.y, p.x, p.y+p.h);
    grad.addColorStop(0, p.c);
    grad.addColorStop(1, '#111');
    X.fillStyle = grad;
    X.fillRect(p.x, p.y, p.w, p.h);
    X.fillStyle = 'rgba(255,255,255,0.1)';
    X.fillRect(p.x, p.y, p.w, 2);
  }

  // Portal
  if (G.portal) drawPortal(G.portal);

  // Pickups
  for (const pk of G.pickups) {
    pk.bob += 0.05;
    const by = Math.sin(pk.bob)*4;
    if (pk.type === 'star') {
      X.fillStyle = '#ff0';
      drawStar5(pk.x+8, pk.y+8+by, 8);
      X.fillStyle = 'rgba(255,255,0,0.3)';
      X.beginPath(); X.arc(pk.x+8, pk.y+8+by, 12, 0, Math.PI*2); X.fill();
    } else {
      X.fillStyle = '#f44';
      X.fillRect(pk.x+2, pk.y+by, 12, 8);
      X.fillRect(pk.x, pk.y+2+by, 16, 4);
      X.fillRect(pk.x+6, pk.y-2+by, 4, 4);
    }
  }

  // Enemies
  for (const e of G.enemies) drawEnemy(e);

  // Player
  drawPlayer();

  // Particles
  for (const p of G.particles) {
    X.fillStyle = p.c;
    X.globalAlpha = p.life/60;
    X.fillRect(p.x, p.y, p.s, p.s);
  }
  X.globalAlpha = 1;

  // HUD
  X.fillStyle = 'rgba(0,0,0,0.6)';
  X.fillRect(0, 0, 800, 36);
  X.fillStyle = '#fff';
  X.font = '14px Courier New';
  X.fillText(`УРОВЕНЬ ${G.level+1}: ${l.name}`, 10, 14);
  X.fillText(`СЧЁТ: ${G.score}`, 10, 30);
  X.fillText('❤'.repeat(G.lives), 300, 24);
  X.fillStyle = '#aaa';
  X.fillText(`A/D или ←/→ — движение  W/↑/ПРОБЕЛ — прыжок`, 450, 24);
  if (G.portal) {
    const pd = Math.sqrt((G.px+10-G.portal.x-20)**2 + (G.py+20-G.portal.y-30)**2);
    if (pd < 100) {
      X.fillStyle = '#c8f';
      X.font = '16px Courier New';
      X.fillText('→ ПОРТАЛ! ВХОДИ!', 320, 60);
    }
  }
}

function drawStar5(cx, cy, r) {
  X.beginPath();
  for (let i = 0; i < 5; i++) {
    const a1 = (i*72-90)*Math.PI/180;
    const a2 = ((i*72+36)-90)*Math.PI/180;
    X.lineTo(cx+Math.cos(a1)*r, cy+Math.sin(a1)*r);
    X.lineTo(cx+Math.cos(a2)*r*0.4, cy+Math.sin(a2)*r*0.4);
  }
  X.closePath(); X.fill();
}

function drawTitle() {
  // Nebula effect
  for (let i = 0; i < 5; i++) {
    X.fillStyle = `rgba(${100+i*30},${20+i*10},${180-i*20},${0.1+Math.sin(G.time*0.02+i)*0.05})`;
    X.beginPath();
    X.arc(400+Math.sin(G.time*0.01+i*2)*100, 250+Math.cos(G.time*0.015+i)*50, 100+i*30, 0, Math.PI*2);
    X.fill();
  }
  // Title
  X.save();
  X.translate(400, 150);
  X.rotate(Math.sin(G.time*0.02)*0.05);
  X.fillStyle = '#fff';
  X.font = 'bold 48px Courier New';
  X.textAlign = 'center';
  X.fillText('ПУРЛЯУ', 0, 0);
  X.font = 'bold 32px Courier New';
  X.fillStyle = '#c8f';
  X.fillText('среди ЗВЁЗД', 0, 45);
  X.restore();
  // Subtitle
  X.textAlign = 'center';
  X.fillStyle = `rgba(255,255,255,${0.5+Math.sin(G.time*0.05)*0.5})`;
  X.font = '18px Courier New';
  X.fillText('Нажми Enter чтобы начать!', 400, 300);
  X.fillStyle = '#888';
  X.font = '12px Courier New';
  X.fillText('11 уровней космического приключения!', 400, 340);
  X.fillText('Прыгай, уворачивайся, собирай звёзды!', 400, 360);
  X.textAlign = 'left';
}

function drawStory() {
  const l = LEVELS[G.level];
  X.fillStyle = 'rgba(0,0,0,0.8)';
  X.fillRect(100, 150, 600, 200);
  X.strokeStyle = l.starColor;
  X.lineWidth = 2;
  X.strokeRect(100, 150, 600, 200);
  X.fillStyle = '#fff';
  X.font = '20px Courier New';
  X.textAlign = 'center';
  X.fillText(`УРОВЕНЬ ${G.level+1}`, 400, 190);
  X.fillStyle = l.starColor;
  X.font = '16px Courier New';
  X.fillText(l.name, 400, 220);
  if (G.storyQueue.length > 0) {
    const txt = G.storyQueue[0];
    const vis = Math.min(txt.length, Math.floor(G.storyTimer/2));
    X.fillStyle = '#ccc';
    X.font = '15px Courier New';
    X.fillText(txt.substring(0, vis), 400, 270);
  }
  X.fillStyle = '#666';
  X.font = '12px Courier New';
  X.fillText('Нажми Enter чтобы пропустить', 400, 320);
  X.textAlign = 'left';
}

function drawGameOver() {
  X.fillStyle = 'rgba(0,0,0,0.85)';
  X.fillRect(0, 0, 800, 500);
  X.fillStyle = '#f44';
  X.font = 'bold 48px Courier New';
  X.textAlign = 'center';
  X.fillText('GAME OVER', 400, 200);
  X.fillStyle = '#aaa';
  X.font = '18px Courier New';
  X.fillText(`Счёт: ${G.score}`, 400, 260);
  X.fillText(`Дошёл до уровня ${G.level+1}: ${LEVELS[G.level].name}`, 400, 290);
  X.fillStyle = `rgba(255,255,255,${0.5+Math.sin(G.time*0.05)*0.5})`;
  X.font = '16px Courier New';
  X.fillText('Нажми Enter чтобы начать заново', 400, 350);
  X.textAlign = 'left';
}

function drawWin() {
  for (let i = 0; i < 8; i++) {
    X.fillStyle = `hsla(${(G.time*2+i*45)%360},80%,50%,0.15)`;
    X.beginPath();
    X.arc(400+Math.sin(G.time*0.02+i)*200, 250+Math.cos(G.time*0.015+i*1.5)*150, 60+i*15, 0, Math.PI*2);
    X.fill();
  }
  X.fillStyle = '#ff0';
  X.font = 'bold 44px Courier New';
  X.textAlign = 'center';
  X.fillText('ПОБЕДА!!!', 400, 180);
  X.fillStyle = '#fff';
  X.font = '20px Courier New';
  X.fillText('ПУРЛЯУ ПОКОРИЛ ВСЕЛЕННУУУУ!', 400, 230);
  X.fillStyle = '#c8f';
  X.font = '18px Courier New';
  X.fillText(`Финальный счёт: ${G.score}`, 400, 280);
  X.fillText('Все 11 уровней пройдены!', 400, 310);
  X.fillStyle = `rgba(255,255,255,${0.5+Math.sin(G.time*0.05)*0.5})`;
  X.font = '14px Courier New';
  X.fillText('Нажми Enter чтобы играть снова', 400, 370);
  X.textAlign = 'left';
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

document.addEventListener('keydown', e => {
  G.keys[e.code] = true;
  if (e.code === 'Enter') {
    if (G.state === 'title') { startLevel(0); }
    else if (G.state === 'story') { G.storyQueue = []; G.state = 'play'; }
    else if (G.state === 'gameover' || G.state === 'win') {
      G.state = 'title'; G.level = 0; G.lives = 3; G.score = 0; G.time = 0;
    }
  }
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
document.addEventListener('keyup', e => { G.keys[e.code] = false; });

gameLoop();
</script>
</body>
</html>
